name: 'Enterprise PaaS CI/CD'

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ==========================================
  # STAGE 1: BUILD & VALIDATE
  # ==========================================
  build:
    name: 'Stage 1: Validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Validate
        run: terraform validate

  # ==========================================
  # STAGE 2: INFRASTRUCTURE DEPLOY
  # ==========================================
  deploy_infra:
    name: 'Stage 2: Deploy Infra'
    runs-on: ubuntu-latest
    needs: build
    outputs:
      app_name: ${{ steps.output_app.outputs.APP_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Extract App Name Output
        id: output_app
        run: |
          APP_NAME=$(terraform output -raw app_service_name)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT

  # ==========================================
  # STAGE 3: APPLICATION DEPLOY
  # ==========================================
  deploy_app:
    name: 'Stage 3: Deploy App'
    runs-on: ubuntu-latest
    needs: deploy_infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Package Application Files
        run: |
          cd src
          zip -r ../app.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: '${{ needs.deploy_infra.outputs.app_name }}'
          package: 'app.zip'
          clean: true
