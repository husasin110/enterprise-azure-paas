name: 'Enterprise PaaS CI/CD'

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ==========================================
  # STAGE 1: BUILD & PLAN
  # ==========================================
  build:
    name: 'Stage 1: Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  # ==========================================
  # STAGE 2: INFRASTRUCTURE DEPLOY
  # ==========================================
  deploy_infra:
    name: 'Stage 2: Deploy Infra'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

# ==========================================
  # STAGE 3: APPLICATION DEPLOY
  # ==========================================
  deploy_app:
    name: 'Stage 3: Deploy App'
    runs-on: ubuntu-latest
    needs: deploy_infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to Azure using the Service Principal credentials
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      # Clear out any default Azure placeholder files on the app server
      - name: Clear Default Web Root
        run: |
          az webapp ssh --resource-group "rg-enterprise-app-prod" --name "app-enterprise-30278" --command "rm -rf /home/site/wwwroot/*" || true

      # Package the contents of the src folder into a zip
      - name: Package Application Files
        run: |
          cd src
          zip -r ../app.zip .

      # Deploy the zip package directly to the Web App root
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-enterprise-30278'
          package: 'app.zip'
