name: 'Terraform Enterprise App Deployment'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger the pipeline manually from the GitHub UI

# These environment variables authenticate Terraform with Azure
env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  terraform:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest
    
    steps:
      # 1. Pull the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install the correct version of Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # 3. Initialize the Azure backend
      - name: Terraform Init
        run: terraform init

      # 4. Check formatting (Optional but recommended)
      - name: Terraform Format
        run: terraform fmt 

      # 5. Generate the execution plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        
      # 6. Apply the configuration (Only runs on the main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      # 7. Log in to Azure for Application Deployment
      - name: Azure Login
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      # 8. Clean old zip archives to avoid caching issues
      - name: Clean Previous Zip Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm -f app.zip

      # 9. Package the latest contents of the src folder
      - name: Package Application Files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd src
          zip -r ../app.zip .

      # 10. Dynamically find the active App Service name
      - name: Dynamically Find App Service Name
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          APP_NAME=$(az webapp list --query "[?starts_with(name, 'app-enterprise')].name | [0]" -o tsv)
          echo "Found App Service: $APP_NAME"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      # 11. Deploy the fresh zip package to Azure Web App
      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: '${{ env.APP_NAME }}'
          package: 'app.zip'
          clean: true
